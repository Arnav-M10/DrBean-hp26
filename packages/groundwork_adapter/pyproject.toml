[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "counterdex"
version = "0.1.0"
description = "Bounded fixed-pair measurement guidance with exact native replay"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = []

[project.scripts]
counterdex = "counterdex.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["counterdex*"]
