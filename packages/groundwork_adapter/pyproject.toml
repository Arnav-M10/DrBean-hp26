[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "counterdex"
version = "0.3.0"
description = "Bounded candidate discovery, exact historical checks and measurement decisions"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = []

[project.scripts]
counterdex = "counterdex.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["counterdex*"]
