[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "counterdex"
version = "0.3.0"
description = "Bounded candidate discovery, exact historical checks and measurement decisions"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = []
keywords = ["scientific-inference", "counterexamples", "exact-arithmetic", "experiment-design", "kinetics"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[project.urls]
Homepage = "https://github.com/Arnav-M10/DrBean-hp26"
Documentation = "https://github.com/Arnav-M10/DrBean-hp26/tree/main/packages/groundwork_adapter/docs"
Source = "https://github.com/Arnav-M10/DrBean-hp26/tree/main/packages/groundwork_adapter"
Issues = "https://github.com/Arnav-M10/DrBean-hp26/issues"

[project.scripts]
counterdex = "counterdex.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["counterdex*"]
