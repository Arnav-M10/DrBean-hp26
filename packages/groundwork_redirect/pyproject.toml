[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "groundwork-adapter"
version = "0.3.0"
description = "Migration package: install Counterdex for scientific counterexamples, measurement design and native replay"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = ["counterdex==0.3.0"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[project.urls]
Counterdex = "https://pypi.org/project/counterdex/"
Source = "https://github.com/Arnav-M10/DrBean-hp26/tree/main/packages/groundwork_adapter"
Issues = "https://github.com/Arnav-M10/DrBean-hp26/issues"

[tool.setuptools]
packages = []
