[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "counterdex-models"
version = "0.1.0"
description = "Bounded numerical comparison of registered models; separate from Counterdex exact checking"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []
classifiers = ["Programming Language :: Python :: 3", "Topic :: Scientific/Engineering"]

[project.urls]
Homepage = "https://github.com/Arnav-M10/DrBean-hp26"
Documentation = "https://github.com/Arnav-M10/DrBean-hp26/blob/main/packages/counterdex_models/docs/INTERFACE.md"
Source = "https://github.com/Arnav-M10/DrBean-hp26/tree/main/packages/counterdex_models"
Issues = "https://github.com/Arnav-M10/DrBean-hp26/issues"

[project.scripts]
counterdex-models = "counterdex_models.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["counterdex_models*"]
