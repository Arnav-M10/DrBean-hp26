[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "counterdex-models"
version = "0.1.0"
description = "Bounded numerical comparison of registered models; separate from Counterdex exact checking"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
counterdex-models = "counterdex_models.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["counterdex_models*"]
