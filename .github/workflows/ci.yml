name: ci

# Offline only. No model secrets are configured and no job contacts a model provider:
# AI stays in placeholder mode. A green run here is NOT a live-Gemini qualification
# and is not, by itself, a release qualification (see scripts/release/checklist.py).
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  BEAN_AI_MODE: placeholder

jobs:
  macos-operations:
    name: macOS cleanup, durable authority and real native loop
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --python 3.13
      - run: uv venv --python 3.11 .venv-engine
      - run: uv pip install --python .venv-engine/bin/python --no-deps ./packages/groundwork_adapter
      - name: ordinary process limits, permission failures and real retained evidence
        run: |
          export BEAN_COUNTERDEX_PYTHON="$PWD/.venv-engine/bin/python"
          export BEAN_COUNTERDEX_REPLAY_PYTHON="$PWD/.venv-engine/bin/python"
          export PATH="$PWD/.venv-engine/bin:$PATH"
          .venv/bin/python -m pytest -q tests/test_science_boundary.py tests/test_science_parent_loss.py \
            tests/test_cleanup_handles.py tests/test_restart_workflow.py tests/test_restart_evidence.py \
            tests/test_research_authority.py tests/test_research_ledger.py tests/test_research_native_authority.py \
            tests/test_general_research_admission.py tests/test_general_research_citations.py tests/test_general_research_cleanup.py
      # Fault-injection supervisor controls are diagnostic tests. They do not
      # replace ordinary scientific workloads or independent release predicates.

  backend:
    name: backend tests, lint, schemas (Python 3.13)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # Both declared runtimes, so the real-engine backend tests run instead of skipping.
      - run: python3 scripts/dev/launcher.py setup
      - name: backend tests with the qualified CPython 3.11 engine runtime
        run: |
          export BEAN_COUNTERDEX_PYTHON="$PWD/.venv-engine/bin/python"
          export PATH="$PWD/.venv-engine/bin:$PATH"   # some tests look up python3.11 on PATH
          export PYTHONPATH="$PWD/packages/counterdex_models"  # exercise the current-source numerical adapter
          uv run pytest -q tests --ignore=tests/integration -rs
      - run: uv run ruff check apps tests scripts
      - name: exported schemas match the committed ones
        run: |
          uv run python scripts/export_contracts.py
          git diff --exit-code -- shared/contracts

  engine:
    name: engine tests and native replay (CPython 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --no-deps ./packages/groundwork_adapter
      - run: python -m unittest discover -s packages/groundwork_adapter/tests
      - name: fresh native replay of the prepared synthetic bundle
        run: |
          python -m counterdex replay packages/groundwork_adapter/fixtures/checked_success.bundle.json \
            --anchors packages/groundwork_adapter/fixtures/checked_success.anchors.json > replay.json
          python -c "import json; r=json.load(open('replay.json')); assert r['replay']=='passed' and r['expected_binding']=='matches' and r['verification']=='valid', r"
      - name: numerical model comparison (separate counterdex-models package)
        run: |
          python -m unittest discover -s packages/counterdex_models/tests
          python packages/counterdex_models/examples/demo.py

  web:
    name: web unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test
        working-directory: apps/web
      - name: reviewed comparison state and self-contained report checks
        run: node --test workspace-preview/tests/*.test.mjs

  harness:
    name: evaluation harness self-checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python -W error -m unittest discover -s evaluation/tests
      - run: python evaluation/cli.py verify
      - run: python evaluation/cli.py selftest
      - run: python scripts/release/secret_scan.py

  stack:
    name: provider-free actual-stack smoke (one-command launch, restart, reopen)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python3 scripts/dev/launcher.py setup
      - run: python3 -m unittest scripts/dev/test_launcher.py scripts/dev/test_share.py
      - name: scientific process boundary as an ordinary user who owns many processes
        run: python3 scripts/release/user_conditions_check.py
      # Passes when the launch path works. It reports gate G1 separately and does not
      # claim real science until the engine bridge is integrated.
      - run: python3 scripts/release/stack_smoke.py
        if: always()   # still show the launch and science result when the boundary check above fails
      - name: Owner 5 HTTP/invariant suite, when delivered
        if: always()
        run: |
          if ls tests/integration/test_*.py >/dev/null 2>&1; then
            export DRBEAN_SCIENCE_PYTHON="$PWD/.venv-engine/bin/python"
            .venv/bin/python -m pytest -q tests/integration
          else
            echo "not delivered yet: recorded as unrun, not as passed"
          fi

  browser:
    name: browser review, approved design and native replay
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python3 scripts/dev/launcher.py setup
      - name: install pinned browser test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: tests/integration
      - name: install Chromium and system dependencies
        run: node tests/integration/node_modules/playwright/cli.js install --with-deps chromium
      - name: manual editor browser check
        run: node tests/integration/web_manual_smoke.mjs
      - name: empty study entry and explicit resume
        run: node tests/integration/study-entry-browser.mjs
      - name: responsive keyboard, disclosure and reduced-motion checks
        run: |
          export NODE_PATH="$PWD/tests/integration/node_modules"
          node apps/web/check-motion.mjs
      - name: private sessions through actual HTTPS gateway and API
        if: always()
        run: node tests/integration/shared-session-browser.mjs
      - name: private model comparison transport with actual numerical computation
        run: node tests/integration/model_comparison_browser.mjs --results /tmp/drbean-comparison-browser-evidence
      - name: reviewed comparison interface and readable numerical report
        run: |
          export PLAYWRIGHT_MODULE="$PWD/tests/integration/node_modules/playwright"
          BEAN_COMPARISON_EVIDENCE_DIR=var/test-evidence/model-comparison-ui node workspace-preview/check-connected.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: model-comparison-ui-evidence
          path: var/test-evidence/model-comparison-ui
          if-no-files-found: warn
          retention-days: 3
      - name: preferred researcher journey, retained evidence and separate model-failure diagnostic
        run: |
          export PLAYWRIGHT_MODULE="$PWD/tests/integration/node_modules/playwright"
          node workspace-preview/check-static-research.mjs
          BEAN_RESEARCH_BROWSER_EVIDENCE_DIR=var/test-evidence/preferred-research node workspace-preview/check-research.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preferred-research-ui-evidence
          path: var/test-evidence/preferred-research
          if-no-files-found: warn
          retention-days: 3
      - name: ordinary Deep Agents browser investigation and separate checked pair-design
        run: |
          export NODE_PATH="$PWD/tests/integration/node_modules"
          node apps/web/check-research.mjs
      - name: real browser API and science workflow
        run: |
          export NODE_PATH="$PWD/tests/integration/node_modules"
          export BEAN_COUNTERDEX_PYTHON="$PWD/.venv-engine/bin/python"
          node apps/web/check-backend.mjs

      - name: declared actual follow-up with separate acquisition conditions
        run: |
          export NODE_PATH="$PWD/tests/integration/node_modules"
          export BEAN_COUNTERDEX_PYTHON="$PWD/.venv-engine/bin/python"
          BEAN_TEST_FOLLOWUP_ORIGIN=actual node apps/web/check-backend.mjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-diagnostics
          path: var/test-evidence/browser-failures
          if-no-files-found: ignore
          retention-days: 3

  automatic-access:
    name: automatic private sessions, recovery and scientific replay
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python3 scripts/dev/launcher.py setup
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: tests/integration
      - run: node tests/integration/node_modules/playwright/cli.js install --with-deps chromium
      - name: complete offline automatic-access acceptance
        env:
          BEAN_AUTOMATIC_ACCESS_EVIDENCE_DIR: var/test-evidence/automatic-access
        run: node tests/integration/automatic-access-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: automatic-access-acceptance
          path: var/test-evidence/automatic-access
          if-no-files-found: error
          retention-days: 3
