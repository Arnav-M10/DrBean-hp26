[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[project]
name = "dr-bean-backend"
version = "0.1.0"
description = "Dr. Bean GF-2 research workflow backend"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi==0.141.1",
  "pydantic==2.13.4",
  "uvicorn==0.52.1",
  "httpx==0.28.1",
  "Pillow==13.0.0",
  "pypdfium2==5.14.0",
  "google-genai==3.3.0",
  "deepagents==0.7.38",
  "langchain-google-genai==4.5.0",
  "langchain==1.5.0",
]

[dependency-groups]
dev = ["pytest==9.0.2", "ruff==0.15.7"]

[tool.hatch.build.targets.wheel]
packages = ["apps/api/bean_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["apps/api"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
